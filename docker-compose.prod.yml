version: '3.9'
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-senkronize}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: ${POSTGRES_DB:-senkronize}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [senkronize]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-senkronize}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-} --maxmemory 256mb --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    networks: [senkronize]
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'if [ -z "$$REDIS_PASSWORD" ]; then redis-cli ping | grep -q PONG; else redis-cli -a "$$REDIS_PASSWORD" ping | grep -q PONG; fi',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-senkronize}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-senkronize}
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
    env_file: .env
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [senkronize]
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  panel:
    build:
      context: .
      dockerfile: apps/panel/Dockerfile
    restart: unless-stopped
    networks: [senkronize]

  marketing:
    build:
      context: .
      dockerfile: apps/marketing/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
    env_file: .env
    networks: [senkronize]

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    depends_on:
      - backend
      - panel
      - marketing
    networks: [senkronize]

networks:
  senkronize:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  nginx_logs:
