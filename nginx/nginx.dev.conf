events {
  worker_connections 1024;
}

http {
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
  gzip_min_length 1000;

  upstream backend {
    server backend:3001;
  }

  upstream panel {
    server panel:80;
  }

  upstream marketing {
    server marketing:3000;
  }

  # Geliştirme: SSL yok; Host üzerinden aynı sanal host yapısı (localhost / *.localhost)
  server {
    listen 80 default_server;
    server_name api.localhost api.senkronize.com;

    location / {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection 'upgrade';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_cache_bypass $http_upgrade;
      client_max_body_size 10M;
    }
  }

  server {
    listen 80;
    server_name app.localhost app.senkronize.com;

    location / {
      proxy_pass http://panel;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }

  server {
    listen 80;
    server_name localhost senkronize.com www.senkronize.com;

    location / {
      proxy_pass http://marketing;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
