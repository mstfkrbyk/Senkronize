<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yeni sipariş</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f1f5f9;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="padding:24px 24px 8px 24px;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;color:#0f172a;">
              Yeni sipariş
            </td>
          </tr>
          <tr>
            <td style="padding:4px 24px 16px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#64748b;">
              Sipariş <strong style="color:#6366f1;">#{{orderNumber}}</strong> · {{platform}} · {{orderDate}}
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 16px 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border:1px solid #e2e8f0;border-radius:10px;overflow:hidden;">
                <tr style="background-color:#f8fafc;">
                  <td style="padding:10px 12px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:#64748b;text-transform:uppercase;">Özet</td>
                  <td style="padding:10px 12px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:#64748b;text-align:right;">Tutar</td>
                </tr>
                <tr>
                  <td colspan="2" style="padding:14px 12px;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#0f172a;">
                    Toplam: <strong>{{totalTry}}</strong>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 8px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:#334155;">
              Ürünler
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 16px 24px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border-collapse:collapse;border:1px solid #e2e8f0;border-radius:10px;">
                <thead>
                  <tr style="background-color:#f8fafc;">
                    <th align="left" style="padding:10px 12px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:#64748b;">Ürün</th>
                    <th align="center" style="padding:10px 8px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:#64748b;">Adet</th>
                    <th align="right" style="padding:10px 12px;font-family:Arial,Helvetica,sans-serif;font-size:12px;font-weight:700;color:#64748b;">Satır</th>
                  </tr>
                </thead>
                <tbody>
                  {{orderItemRows}}
                </tbody>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 8px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:#334155;">
              Teslimat adresi
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 20px 24px;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#475569;line-height:1.55;padding:14px;border:1px solid #e2e8f0;border-radius:10px;background-color:#fafafa;">
                {{deliveryAddress}}
              </div>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 24px 24px 24px;">
              <a href="{{orderViewUrl}}" style="display:inline-block;padding:14px 28px;background-color:#6366f1;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;text-decoration:none;border-radius:8px;">
                Siparişi Görüntüle
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background-color:#0f172a;text-align:center;">
              <p style="margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#cbd5e1;line-height:1.5;">
                Senkronize | Tüm pazaryerleriniz tek panelde
              </p>
              <a href="{{unsubscribeUrl}}" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#93c5fd;text-decoration:underline;">
                E-posta tercihlerini yönet
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
