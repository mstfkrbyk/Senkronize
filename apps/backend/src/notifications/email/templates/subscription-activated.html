<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Abonelik aktif</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f1f5f9;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="padding:28px 28px 8px 28px;text-align:center;">
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:28px;line-height:1;">🎉</div>
              <div style="font-family:Arial,Helvetica,sans-serif;font-size:22px;font-weight:700;color:#0f172a;margin-top:12px;">Aboneliğiniz aktif!</div>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 16px 28px;font-family:Arial,Helvetica,sans-serif;font-size:15px;color:#475569;line-height:1.6;text-align:center;">
              <strong style="color:#4f46e5;">{{planName}}</strong> planına başarıyla geçtiniz. Aşağıdaki özellikler hesabınızda kullanıma hazır.
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 20px 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="border:1px solid #e2e8f0;border-radius:10px;">
                <tbody>
                  {{planFeatureRows}}
                </tbody>
              </table>
            </td>
          </tr>
          <tr>
            <td align="center" style="padding:0 28px 28px 28px;">
              <a href="{{panelUrl}}" style="display:inline-block;padding:14px 28px;background-color:#4f46e5;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:700;text-decoration:none;border-radius:8px;">
                Paneli Ziyaret Et
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 24px;background-color:#0f172a;text-align:center;">
              <p style="margin:0 0 8px 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#cbd5e1;line-height:1.5;">
                Senkronize | Abonelik bildirimi
              </p>
              <a href="{{unsubscribeUrl}}" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#93c5fd;text-decoration:underline;">
                E-posta tercihlerini yönet
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
