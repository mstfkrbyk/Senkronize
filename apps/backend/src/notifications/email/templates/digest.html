<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bildirim özeti</title>
</head>
<body style="margin:0;padding:0;background-color:#f1f5f9;">
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f1f5f9;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="600" style="max-width:600px;width:100%;background-color:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #e2e8f0;">
          <tr>
            <td style="padding:24px 24px 8px 24px;font-family:Arial,Helvetica,sans-serif;font-size:20px;font-weight:700;color:#0f172a;">
              {{periodLabel}}
            </td>
          </tr>
          <tr>
            <td style="padding:4px 24px 16px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#64748b;">
              Merhaba {{recipientName}}, bu e-postada {{totalCount}} bildirimin özeti yer alıyor.
            </td>
          </tr>
          {{ordersSection}}
          {{stockSection}}
          {{syncSection}}
          {{otherSection}}
          <tr>
            <td style="padding:8px 24px 24px 24px;">
              <a href="{{panelUrl}}"
                 style="background-color:#38bdf8;color:#0f172a;padding:12px 24px;border-radius:8px;text-decoration:none;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;display:inline-block;">
                Panele Git
              </a>
            </td>
          </tr>
          <tr>
            <td style="padding:0 24px 24px 24px;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#94a3b8;">
              Bildirim tercihlerinizi <a href="{{settingsUrl}}" style="color:#38bdf8;">ayarlar</a> sayfasından değiştirebilirsiniz.
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
